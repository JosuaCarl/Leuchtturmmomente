<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <title>{% if page.title %}{{ page.title | append: " | " | append: site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/img/icon/favicon.svg">
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/img/icon/favicon.png">

  <!-- Bootstrap core CSS -->
  <link href="assets/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Local custom fonts (self-hosted) -->
  <style>
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 400;
      src: url("{{ site.baseurl }}/assets/fonts/Montserrat-Regular.ttf") format('truetype');
    }
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 700;
      src: url("{{ site.baseurl }}/assets/fonts/Montserrat-Bold.ttf") format('truetype');
    }
    @font-face {
      font-family: 'Kaushan Script';
      font-style: normal;
      font-weight: 400;
      src: url("{{ site.baseurl }}/assets/fonts/KaushanScript-Regular.ttf") format('truetype');
    }
    @font-face {
      font-family: 'Droid Serif';
      font-style: normal;
      font-weight: 400;
      src: url("{{ site.baseurl }}/assets/fonts/DroidSerif-Regular.ttf") format('truetype');
    }
    @font-face {
      font-family: 'Droid Serif';
      font-style: italic;
      font-weight: 400;
      src: url("{{ site.baseurl }}/assets/fonts/DroidSerif-Italic.ttf") format('truetype');
    }
    @font-face {
      font-family: 'Droid Serif';
      font-style: normal;
      font-weight: 700;
      src: url("{{ site.baseurl }}/assets/fonts/DroidSerif-Bold.ttf") format('truetype');
    }
    @font-face {
      font-family: 'Droid Serif';
      font-style: italic;
      font-weight: 700;
      src: url("{{ site.baseurl }}/assets/fonts/DroidSerif-BoldItalic.ttf") format('truetype');
    }
    @font-face {
      font-family: 'Roboto Slab';
      font-style: normal;
      font-weight: 400;
      src: url("{{ site.baseurl }}/assets/fonts/RobotoSlab-Regular.ttf") format('truetype');
    }
    @font-face {
      font-family: 'Roboto Slab';
      font-style: normal;
      font-weight: 700;
      src: url("{{ site.baseurl }}/assets/fonts/RobotoSlab-Bold.ttf") format('truetype');
    }
  </style>

  <!-- Masthead hero background height -->
  <style>
    header.masthead {
      min-height: 100vh;
      min-height: 100dvh;
    }
  </style>

  <!-- Local Font Awesome 6 (self-hosted) -->
  <link href="{{ site.baseurl }}/assets/css/all.min.css" rel="stylesheet" type="text/css">

  <!-- Custom styles for this theme -->
  <!--<link href="assets/css/agency.min.css" rel="stylesheet">-->
  <link href="assets/css/agency.css" rel="stylesheet" />
  <!-- Portfolio custom styles -->

  <!-- Page container change top padding when nav shrinks -->
  {% if page.layout == "page" %}
  <style>
    #pagecontainer {
      padding-top: 150px;
    }
    @media only screen and (max-width: 991px) {
      #pagecontainer {
        padding-top: 100px;
      }
    }
  </style>
  {% endif %}
</head>
