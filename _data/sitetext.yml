    text: "Unsere Geschichte"
    body: "Individuelle Trauerreden, die Nähe stiften und Halt geben. Hinter Leuchtturmmomente steht die Überzeugung, dass ein Abschiedswort authentisch und persönlich sein sollte. Dass es für jedes Leben prägende Momente gab die bestehen bleiben. Jede Rede wird für Sie erarbeitet – sensibel, wertschätzend und genau auf den verstorbenen Menschen abgestimmt. Lassen Sie uns gemeinsam einen würdevollen Abschluss gestalten."
