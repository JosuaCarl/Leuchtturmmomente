<!DOCTYPE html>
<html lang="{{ site.locale | slice: 0,2 | default: "en" }}">

  {% include head.html %}

  <style>
  .contact-card {
    background: #fff;
    padding: 2rem;
    border-radius: 4px;
    box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.1);
    margin-bottom: 2rem;
    max-width: 400px;
  }
  .contact-card-name {
    font-size: 1.25rem;
    font-weight: 700;
    color: #1d304a;
    margin-bottom: 0.25rem;
  }
  .contact-card-role {
    font-size: 0.9rem;
    color: #6c757d;
    margin-bottom: 1rem;
    font-style: italic;
  }
  .contact-card-detail {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
  }
  .contact-card-detail i {
    color: {{ site.data.style.highlight | default: "#e6b800" }};
    width: 1.25rem;
    text-align: center;
  }
  .contact-card-detail a {
    color: #1d304a;
    text-decoration: none;
  }
  .contact-card-detail a:hover {
    color: {{ site.data.style.highlight | default: "#e6b800" }};
  }
  </style>

  <body id="page-top">

      {{ content }}

	  {% include footer.html %}

	  <!-- Bootstrap core JavaScript -->
	  <script src="assets/js/jquery.min.js"></script>
	  <script src="assets/js/bootstrap.bundle.min.js"></script>

	  <!-- Plugin JavaScript -->
	  <script src="assets/js/jquery.easing.min.js"></script>

	  <!-- Custom scripts for this template -->
	  <script src="assets/js/agency.min.js"></script>

  </body>
</html>
